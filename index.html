<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <style>
        :root {
            --bg: #f6f4ef;
            --card: #ffffff;
            --text: #1d1d1f;
            --muted: #6b6b70;
            --accent: #ff6b4a;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111113;
                --card: #1c1c1f;
                --text: #f2f2f2;
                --muted: #9a9aa0;
            }
        }
        * { box-sizing: border-box; margin: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .card {
            position: relative;
            max-width: 360px;
            padding: 32px;
            border-radius: 20px;
            background: var(--card);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: transform 0.25s ease;
        }
        .card:hover { transform: translateY(-4px); }
        .blob {
            position: absolute;
            top: -40px;
            right: -40px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.85;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            50% { transform: translate(-10px, 10px) scale(1.08); }
        }
        h1 { font-size: 28px; margin-bottom: 8px; position: relative; }
        p { color: var(--muted); line-height: 1.5; position: relative; }
        button {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <div class="blob"></div>
        <h1>Hello there 👋</h1>
        <p>A small card with a floating accent blob, a hover lift, and dark mode support.</p>
        <button>Say hi</button>
    </div>

</html>
